  linux_swift_6_4_android:
    runs-on: ubuntu-latest
    container: swift:6.4.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Version
        run: swift --version
      - name: Install NDK
        run: |
          apt-get update && apt-get install -y curl unzip
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r27d" >> $GITHUB_ENV
      - name: Install SDK
        # download with curl: swift sdk install aborts on exit after a remote download in 6.4.2
        run: |
          curl -sSL -o /tmp/android-sdk.tar.gz https://download.swift.org/swift-6.4.2-release/android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz
          echo "4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233  /tmp/android-sdk.tar.gz" | sha256sum -c
          swift sdk install /tmp/android-sdk.tar.gz
          # SwiftPM installs under the user's home directory (/root), not $HOME
          SDK_BUNDLE=$(find /root "$HOME" -maxdepth 3 -type d -name swift-6.4.2-RELEASE_android.artifactbundle -print -quit 2>/dev/null)
          "$SDK_BUNDLE/swift-android/scripts/setup-android-sdk.sh"
      - name: Build
        run: swift build --swift-sdk aarch64-unknown-linux-android24

  windows_swift_6_4:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4"
      - name: Version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
