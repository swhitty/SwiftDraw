<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" fill="#0066cc" fill-opacity="0.4" stroke="crimson" stroke-opacity="0.5" stroke-width="10">
  <!-- reference: properties inherited through a <g> -->
  <g>
    <rect x="20" y="20" width="80" height="80" />
    <circle cx="60" cy="180" r="40" />
  </g>
  <!-- the same properties inherited from the root into nested <svg> content -->
  <svg x="120" y="0" width="120" height="120">
    <rect x="20" y="20" width="80" height="80" />
  </svg>
  <svg x="120" y="120" width="120" height="120" viewBox="0 0 60 60">
    <circle cx="30" cy="30" r="20" stroke-width="5" />
  </svg>
</svg>
