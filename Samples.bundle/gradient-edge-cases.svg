<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200">
    <!-- stops sharing an offset: the first pads before 0, the last carries on after it, any between are hidden -->
    <linearGradient id="start" x1="0.2" x2="0.8">
        <stop offset="0" stop-color="black"/>
        <stop offset="0" stop-color="red"/>
        <stop offset="0" stop-color="gray"/>
        <stop offset="0.9" stop-color="lightgray"/>
        <stop offset="1" stop-color="white"/>
    </linearGradient>
    <linearGradient id="middle">
        <stop offset="0" stop-color="navy"/>
        <stop offset="0.5" stop-color="skyblue"/>
        <stop offset="0.5" stop-color="red"/>
        <stop offset="0.5" stop-color="gold"/>
        <stop offset="1" stop-color="orange"/>
    </linearGradient>
    <linearGradient id="end" x1="0.2" x2="0.8">
        <stop offset="0" stop-color="white"/>
        <stop offset="1" stop-color="seagreen"/>
        <stop offset="1" stop-color="red"/>
        <stop offset="1" stop-color="purple"/>
    </linearGradient>
    <!-- a negative fr is an error: the focal radius stays 0 -->
    <radialGradient id="fr" fr="-1">
        <stop offset="0" stop-color="black"/>
        <stop offset="1" stop-color="white"/>
    </radialGradient>
    <rect x="10" y="10" width="220" height="40" fill="url(#start)"/>
    <rect x="10" y="60" width="220" height="40" fill="url(#middle)"/>
    <rect x="10" y="110" width="220" height="40" fill="url(#end)"/>
    <!-- an empty gradientTransform is the identity, overriding the one it would inherit -->
    <linearGradient id="rotated" gradientTransform="rotate(90 0.5 0.5)">
        <stop offset="0" stop-color="green"/>
        <stop offset="1" stop-color="blue"/>
    </linearGradient>
    <linearGradient id="unrotated" href="#rotated" gradientTransform=""/>
    <rect x="10" y="160" width="100" height="35" fill="url(#fr)"/>
    <rect x="130" y="160" width="100" height="35" fill="url(#unrotated)"/>
</svg>
