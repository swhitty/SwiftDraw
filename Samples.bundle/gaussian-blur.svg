<svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft" x="-0.2" y="-0.2" width="1.4" height="1.4">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="horizontal">
      <feGaussianBlur stdDeviation="6 0" />
    </filter>
  </defs>
  <!-- Inkscape-style soft shadow: a blurred copy under the shape -->
  <circle cx="54" cy="64" r="34" fill="#000" fill-opacity="0.5" filter="url(#soft)" />
  <circle cx="50" cy="60" r="34" fill="#e63946" />
  <!-- glow on a group -->
  <g filter="url(#soft)">
    <rect x="110" y="20" width="60" height="30" rx="6" fill="#f1c40f" />
    <rect x="110" y="20" width="60" height="30" rx="6" fill="none" stroke="#e67e22" stroke-width="4" transform="translate(0, 45)" />
  </g>
  <rect x="120" y="95" width="40" height="8" fill="#457b9d" filter="url(#horizontal)" />
</svg>
