<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <!-- Asymmetric tiles: triangles point up and squares sit in the top-left corner of each tile. -->
  <defs>
    <pattern id="tri" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M0 25 L12.5 0 L25 25 Z" fill="#E2534B"/>
    </pattern>
    <pattern id="corner" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#34D3F2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#tri)"/>
  <rect x="100" y="5" width="100" height="95" fill="url(#corner)"/>
</svg>
