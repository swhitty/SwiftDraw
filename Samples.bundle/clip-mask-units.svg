<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="160" viewBox="0 0 240 160">
  <defs>
    <clipPath id="bbox" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.5"/>
    </clipPath>
    <clipPath id="holed" clip-rule="evenodd">
      <path d="M90 10h60v60h-60z M105 25h30v30h-30z"/>
    </clipPath>
    <rect id="bar" width="12" height="60"/>
    <clipPath id="bars">
      <use xlink:href="#bar" x="170"/>
      <use xlink:href="#bar" x="194"/>
      <use xlink:href="#bar" x="218"/>
    </clipPath>
    <clipPath id="half"><rect x="0" y="80" width="40" height="80"/></clipPath>
    <clipPath id="nested" clip-path="url(#half)">
      <circle cx="40" cy="120" r="30"/>
    </clipPath>
    <clipPath id="text">
      <text x="90" y="140" font-size="40" font-family="Helvetica" font-weight="bold">SD8</text>
    </clipPath>
    <linearGradient id="fade"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="fadeMask" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="url(#fade)"/>
    </mask>
  </defs>
  <!-- clipPathUnits="objectBoundingBox": a circle inscribed in the rect -->
  <rect x="10" y="10" width="60" height="60" fill="tomato" clip-path="url(#bbox)"/>
  <!-- clip-rule on the clipPath: a square ring -->
  <rect x="80" y="0" width="80" height="80" fill="seagreen" clip-path="url(#holed)"/>
  <!-- <use> inside clipPath: three bars -->
  <rect x="160" y="10" width="80" height="60" fill="steelblue" clip-path="url(#bars)"/>
  <!-- clip-path on clipPath: the left half of a circle -->
  <rect x="0" y="80" width="80" height="80" fill="orange" clip-path="url(#nested)"/>
  <!-- text inside clipPath -->
  <rect x="80" y="90" width="100" height="60" fill="purple" clip-path="url(#text)"/>
  <!-- maskContentUnits="objectBoundingBox": a horizontal fade -->
  <rect x="190" y="90" width="40" height="60" fill="navy" mask="url(#fadeMask)"/>
</svg>
