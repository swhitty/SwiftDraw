<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" font-family="Helvetica" font-size="22">
  <!-- textLength fits text to a length: lengthAdjust="spacing" (the default) changes the space
       between the characters, "spacingAndGlyphs" stretches the glyphs too -->
  <path d="M10 0 V150 M230 0 V150" stroke="silver"/>
  <text x="10" y="30" textLength="220">Spacing</text>
  <text x="10" y="60" textLength="220" lengthAdjust="spacingAndGlyphs" fill="teal">Stretched</text>
  <text x="10" y="90" textLength="120" lengthAdjust="spacingAndGlyphs" fill="crimson">Squeezed text</text>
  <!-- on a tspan: the text after it moves on -->
  <text x="10" y="120">a <tspan textLength="90" fill="purple">long</tspan> word</text>
  <!-- a badge, as shields.io draws them: scaled down and centred over a fixed length -->
  <g transform="translate(70 160)">
    <rect width="100" height="20" rx="3" fill="#555"/>
    <path d="M60 0h37a3 3 0 0 1 3 3v14a3 3 0 0 1 -3 3h-37z" fill="#4c1"/>
    <g fill="#fff" text-anchor="middle" font-size="110">
      <text x="300" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="500">coverage</text>
      <text x="300" y="140" transform="scale(.1)" textLength="500">coverage</text>
      <text x="795" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="290">97%</text>
      <text x="795" y="140" transform="scale(.1)" textLength="290">97%</text>
    </g>
  </g>
</svg>
