<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filter Effects 1 §9.21: Perlin noise in user space, from the spec's reference code -->
    <filter id="turbulence" x="0" y="0" width="1" height="1">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" seed="3" />
    </filter>
    <filter id="fractal" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.12" numOctaves="3" />
    </filter>
    <!-- in sRGB the noise is darker than in the default linearRGB -->
    <filter id="srgb" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" seed="3" />
    </filter>
    <!-- noise as an alpha mask: paper texture over the source -->
    <filter id="paper" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" seed="7" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0 0.1  0 0 0 -2.4 1.3" result="grain" />
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="speckle" />
      <feMerge><feMergeNode in="SourceGraphic" /><feMergeNode in="speckle" /></feMerge>
    </filter>
    <!-- a negative frequency is an error: nothing is drawn -->
    <filter id="negative">
      <feTurbulence baseFrequency="-0.05" />
    </filter>
  </defs>
  <rect x="10" y="10" width="85" height="85" filter="url(#turbulence)" />
  <rect x="105" y="10" width="85" height="85" filter="url(#fractal)" />
  <rect x="200" y="10" width="85" height="85" filter="url(#srgb)" />
  <!-- noise is in user space: skewed with the element -->
  <rect x="0" y="105" width="85" height="85" transform="skewX(20)" filter="url(#turbulence)" />
  <circle cx="160" cy="150" r="42" fill="#e9c46a" filter="url(#paper)" />
  <rect x="210" y="110" width="80" height="80" fill="#e63946" filter="url(#negative)" />
  <rect x="210" y="110" width="80" height="80" fill="none" stroke="#999" stroke-dasharray="4" />
</svg>
