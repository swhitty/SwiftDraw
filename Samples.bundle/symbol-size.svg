<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!-- SVG 2: x, y, width and height on <symbol> place and size the viewport a <use> creates -->

  <!-- the symbol's own size, used when the <use> sets none -->
  <symbol id="dot" viewBox="0 0 10 10" width="60" height="60">
    <circle cx="5" cy="5" r="5" fill="crimson"/>
  </symbol>
  <use href="#dot" x="10" y="10"/>
  <!-- the <use>'s size wins over the symbol's -->
  <use href="#dot" x="80" y="10" width="30" height="30"/>
  <!-- each side on its own: the <use>'s width, the symbol's height (meet keeps it 30 wide) -->
  <use href="#dot" x="120" y="10" width="30"/>

  <!-- x and y on the symbol add to those of the <use>; overflow is clipped to the viewport -->
  <symbol id="box" x="20" y="20" width="40" height="40">
    <rect width="80" height="80" fill="seagreen"/>
  </symbol>
  <use href="#box" x="160" y="-10"/>

  <!-- percentages resolve against the viewport that contains the <use> -->
  <symbol id="wide" viewBox="0 0 20 10" width="25%" height="20%" preserveAspectRatio="none">
    <rect width="20" height="10" fill="royalblue"/>
    <rect width="10" height="5" fill="gold"/>
  </symbol>
  <use href="#wide" x="240" y="10"/>

  <!-- contents resolve percentages against the symbol's viewport -->
  <symbol id="fill">
    <rect width="100%" height="100%" fill="orange"/>
    <rect x="25%" y="25%" width="50%" height="50%" fill="purple"/>
  </symbol>
  <use href="#fill" x="10" y="100" width="120" height="80"/>

  <!-- transform on <symbol> is ignored, as in SVG 1.1, WebKit and resvg -->
  <symbol id="skew" transform="skewX(30)" width="80" height="80">
    <rect x="10" y="10" width="60" height="60" fill="teal"/>
  </symbol>
  <use href="#skew" x="160" y="100"/>

  <!-- overflow visible shows what lies outside the symbol's viewport -->
  <symbol id="spill" width="40" height="40" overflow="visible">
    <circle cx="40" cy="40" r="30" fill="slateblue"/>
  </symbol>
  <use href="#spill" x="260" y="100"/>
</svg>
