<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2a9d8f" />
      <stop offset="1" stop-color="#e9c46a" />
    </radialGradient>
    <pattern id="checks" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="10" height="10" fill="#e76f51" opacity="0.75" />
      <rect x="5" y="5" width="10" height="10" fill="#264653" opacity="0.75" />
    </pattern>
    <!-- Filter Effects 1 §9.17: erode shrinks each channel's shapes -->
    <filter id="erode">
      <feMorphology operator="erode" radius="6" />
    </filter>
    <filter id="dilate" x="-0.2" y="-0.2" width="1.4" height="1.4">
      <feMorphology operator="dilate" radius="6" />
    </filter>
    <!-- two values: x then y -->
    <filter id="wide" x="-0.3" y="-0.3" width="1.6" height="1.6">
      <feMorphology operator="dilate" radius="10 2" />
    </filter>
    <!-- an outline: the dilated alpha, flooded, under the source -->
    <filter id="outline" x="-0.4" y="-0.4" width="1.8" height="1.8">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="thick" />
      <feFlood flood-color="#e63946" />
      <feComposite in2="thick" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <!-- in primitiveUnits, a fraction of the bounding box -->
    <filter id="bbox" primitiveUnits="objectBoundingBox">
      <feMorphology operator="erode" radius="0.03 0.015" />
    </filter>
    <!-- zero disables the primitive: the input, as in WebKit (resvg erodes) -->
    <filter id="zero">
      <feMorphology operator="erode" radius="0" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="38" fill="url(#glow)" filter="url(#erode)" />
  <path d="M150 15 L160 45 L190 45 L165 63 L175 92 L150 74 L125 92 L135 63 L110 45 L140 45 Z" fill="#457b9d" filter="url(#dilate)" />
  <g filter="url(#wide)">
    <rect x="240" y="20" width="20" height="20" fill="#f4a261" />
    <rect x="240" y="60" width="20" height="20" fill="#2a9d8f" />
  </g>
  <path d="M20 160 C40 110, 80 210, 100 160" fill="none" stroke="#1d3557" stroke-width="6" filter="url(#outline)" />
  <rect x="110" y="110" width="80" height="80" fill="url(#checks)" filter="url(#bbox)" />
  <rect x="210" y="110" width="80" height="80" fill="url(#checks)" filter="url(#zero)" />
</svg>
