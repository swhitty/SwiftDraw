<svg width="240" height="100" viewBox="0 0 240 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- a hard, opaque coloured shadow -->
    <filter id="opaque" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#264653" />
    </filter>
    <!-- flood-color and flood-opacity from style -->
    <filter id="styled" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="5" stdDeviation="3" style="flood-color: rgb(230, 57, 70); flood-opacity: 0.6" />
    </filter>
  </defs>
  <rect width="240" height="100" fill="#f4f1ea" />
  <rect x="25" y="20" width="60" height="50" fill="#e9c46a" filter="url(#opaque)" />
  <circle cx="170" cy="45" r="28" fill="#457b9d" filter="url(#styled)" />
</svg>
