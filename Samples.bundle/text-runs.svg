<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160" font-family="Helvetica" font-size="22">
  <!-- every run of a <text> is drawn with its own style, one after another -->
  <path d="M120 0 V160" stroke="silver"/>
  <text x="10" y="34">Te<tspan fill="green" font-weight="bold">xt</tspan> <tspan fill="blue" font-style="italic" font-size="28">runs</tspan>!</text>
  <!-- the anchor applies to the whole chunk; a hidden span keeps its space, display none takes none -->
  <text x="120" y="74" text-anchor="middle">mid<tspan fill="crimson">dle</tspan><tspan visibility="hidden">__</tspan>!<tspan display="none">gone</tspan></text>
  <!-- an absolute x or y starts a new chunk, anchored on its own -->
  <text text-anchor="end" fill="purple"><tspan x="120" y="110">end</tspan><tspan x="230" y="110" fill="orange">two</tspan></text>
  <text x="10" y="146" xml:space="preserve">a   <tspan fill="teal" xml:space="default">  b  </tspan>  c</text>
</svg>
