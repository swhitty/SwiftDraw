<?xml version="1.0" encoding="utf-8"?>
<!-- SD13: percentages, em/ex and a width-only root that takes its height from the viewBox (200x150) -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" viewBox="0 0 400 300" font-size="20">
  <rect width="100%" height="100%" fill="snow"/>
  <rect x="5%" y="5%" width="40%" height="40%" rx="5%" fill="orange"/>
  <circle cx="75%" cy="25%" r="10%" fill="teal"/>
  <line x1="5%" y1="55%" x2="95%" y2="55%" stroke="black" stroke-width="4"/>
  <rect x="1em" y="60%" width="4em" height="3ex" fill="purple"/>
  <svg x="50%" y="60%" width="45%" height="35%" viewBox="0 0 10 10">
    <rect width="100%" height="100%" fill="gold"/>
    <circle cx="50%" cy="50%" r="40%" fill="crimson"/>
  </svg>
</svg>
