<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- preserveAspectRatio, viewBox and overflow of a <symbol> in viewports wider and taller than its viewBox -->
  <defs>
    <symbol id="meet-min" viewBox="0 0 20 20" preserveAspectRatio="xMinYMin meet"><circle cx="10" cy="10" r="10"/></symbol>
    <symbol id="meet-mid" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10"/></symbol>
    <symbol id="meet-max" viewBox="0 0 20 20" preserveAspectRatio="xMaxYMax meet"><circle cx="10" cy="10" r="10"/></symbol>
    <symbol id="slice-min" viewBox="0 0 20 20" preserveAspectRatio="xMinYMin slice"><circle cx="10" cy="10" r="10"/></symbol>
    <symbol id="slice-mid" viewBox="0 0 20 20" preserveAspectRatio="xMidYMid slice"><circle cx="10" cy="10" r="10"/></symbol>
    <symbol id="none" viewBox="0 0 20 20" preserveAspectRatio="none"><circle cx="10" cy="10" r="10"/></symbol>
    <!-- the viewBox origin is offset; contents outside the viewBox overflow it -->
    <symbol id="offset" viewBox="10 10 20 20"><rect x="5" y="5" width="30" height="30"/><circle cx="20" cy="20" r="8" fill="white"/></symbol>
    <symbol id="offset-visible" viewBox="10 10 20 20" overflow="visible"><rect x="5" y="5" width="30" height="30"/><circle cx="20" cy="20" r="8" fill="white"/></symbol>
    <!-- no viewBox: drawn unscaled, clipped to the viewport -->
    <symbol id="plain"><rect width="60" height="60"/><circle cx="20" cy="20" r="15" fill="white"/></symbol>
  </defs>

  <g fill="none" stroke="silver">
    <rect x="10" y="10" width="110" height="50"/>
    <rect x="140" y="10" width="110" height="50"/>
    <rect x="270" y="10" width="110" height="50"/>
    <rect x="10" y="80" width="50" height="110"/>
    <rect x="80" y="80" width="50" height="110"/>
    <rect x="150" y="80" width="50" height="110"/>
    <rect x="220" y="80" width="110" height="50"/>
    <rect x="220" y="140" width="110" height="50"/>
    <rect x="40" y="230" width="60" height="60"/>
    <rect x="160" y="230" width="60" height="60"/>
    <rect x="280" y="230" width="40" height="40"/>
  </g>

  <use href="#meet-min" x="10" y="10" width="110" height="50" fill="tomato"/>
  <use href="#meet-mid" x="140" y="10" width="110" height="50" fill="tomato"/>
  <use href="#meet-max" x="270" y="10" width="110" height="50" fill="tomato"/>

  <use href="#meet-min" x="10" y="80" width="50" height="110" fill="steelblue"/>
  <use href="#meet-mid" x="80" y="80" width="50" height="110" fill="steelblue"/>
  <use href="#meet-max" x="150" y="80" width="50" height="110" fill="steelblue"/>

  <use href="#slice-min" x="220" y="80" width="110" height="50" fill="seagreen"/>
  <use href="#slice-mid" x="220" y="140" width="110" height="50" fill="seagreen"/>
  <use href="#none" x="340" y="80" width="50" height="110" fill="seagreen"/>

  <use href="#offset" x="40" y="230" width="60" height="60" fill="purple"/>
  <use href="#offset-visible" x="160" y="230" width="60" height="60" fill="purple"/>
  <use href="#plain" x="280" y="230" width="40" height="40" fill="darkorange"/>

  <!-- width / height default to 100% of the viewport -->
  <use href="#meet-mid" transform="translate(310 290) scale(0.2)" fill="goldenrod"/>
</svg>
